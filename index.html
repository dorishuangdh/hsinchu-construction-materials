<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>新竹海淡物料管理系統</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#1d2330; --muted:#6b7280; --line:#e3e6eb;
  --pri:#1f5fbf; --pri-weak:#e8f0fc; --ok:#1d8a4e; --ok-weak:#e5f5ec; --warn:#b76e00; --warn-weak:#fdf2e0;
  --bad:#c23b32; --bad-weak:#fbe9e7; --grey-weak:#eef0f3; --radius:10px;
}
*{box-sizing:border-box}
:root{color-scheme:light}
button,select,input,textarea{-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:auto}input[type=radio]{-webkit-appearance:radio;appearance:auto}
select.inp{background-image:linear-gradient(45deg,transparent 50%,#6b7280 50%),linear-gradient(135deg,#6b7280 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
header{background:#14213d;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:600;flex:1;white-space:nowrap}
header .user{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header .user button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px}
nav{background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:12px 14px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
nav button .lk{font-size:11px;margin-left:3px;opacity:.7}
main{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:14px 0 8px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.inp{width:100%;padding:9px 10px;border:1px solid #cfd4dc;border-radius:8px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
.inp:focus{outline:2px solid var(--pri-weak);border-color:var(--pri)}
.inp:disabled{background:#f3f4f6;color:#888}
textarea.inp{min-height:90px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{border:1px solid #cfd4dc;background:#fff;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit}
.btn:hover{background:#f6f7f9}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.bad{color:var(--bad);border-color:#e7b6b1}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.big{width:100%;padding:13px;font-size:16px;margin-top:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.sp{flex:1}
.muted{color:var(--muted)}
small,.small{font-size:12.5px}
.hide{display:none!important}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:#fafbfc;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
.tbl{overflow-x:auto}
.thumb{width:46px;height:46px;object-fit:cover;border-radius:6px;cursor:zoom-in;border:1px solid var(--line);background:#eee}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--grey-weak);margin:2px 3px 2px 0;white-space:nowrap}
.chip.pri{background:var(--pri-weak);color:var(--pri)}
.chip.ok{background:var(--ok-weak);color:var(--ok)}
.chip.warn{background:var(--warn-weak);color:var(--warn)}
.chip.bad{background:var(--bad-weak);color:var(--bad)}
.chip .x{cursor:pointer;margin-left:4px;opacity:.6}
.banner{border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;background:var(--ok-weak);color:#14532d;border:1px solid #b9e3c9}
.banner.info{background:var(--pri-weak);color:#173f7a;border-color:#c5d7f3}
.info{background:#f8fafc;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:10px}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14.5px;margin-top:14px;cursor:pointer}
.chk input{width:18px;height:18px}
details summary{cursor:pointer;color:var(--pri);font-size:13.5px;margin-top:6px}
.vtable td{padding:5px 6px}
.vtable input{max-width:120px}
/* 折疊清單 */
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cats button{border:1px solid #cfd4dc;background:#fff;color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13.5px;font-family:inherit}
.cats button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.cats .cn{display:inline-block;margin-left:4px;font-size:11.5px;opacity:.7}
.cats .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;margin-left:4px}
.cats button.on .n{background:#fff;color:var(--bad)}
.fold{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff;overflow:hidden}
.fold>.hd{padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;flex-wrap:wrap}
.fold>.hd:hover{background:#fafbfc}
.fold>.bd{border-top:1px solid var(--line);padding:10px 12px;background:#fcfcfd}
.fold .fold{margin:6px 0}
.caret{display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
.open>.hd .caret{transform:rotate(90deg)}
.mname{font-weight:600}
.mname.arrived{color:var(--pri)}
.mname.notyet{color:#9aa1ab;font-weight:500}
tr.gh td{background:#eef2f8;font-weight:700;color:#14213d;font-size:14px}
tr.gs td{background:#fafbfc;color:var(--muted);font-size:12.5px;font-weight:600;padding:5px 8px}
@media(max-width:640px){
  .stk thead{display:none}
  .stk tr.gh,.stk tr.gs{display:block}.stk tr.gh td,.stk tr.gs td{display:block}
  .stk tr.it{display:grid;grid-template-columns:52px minmax(0,1fr);column-gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .stk tr.it td{border:0;padding:2px 0;grid-column:2;text-align:left}
  .stk tr.it td:first-child{grid-column:1;grid-row:1/span 6}
  .stk tr.it td[data-l]::before{content:attr(data-l) '　';color:var(--muted);font-size:12px}
  .stk tr.it td.nil{display:none}
}
.catttl{font-size:13px;color:var(--muted);margin:16px 0 6px;font-weight:600;letter-spacing:.5px}
.bar{height:7px;background:#e8eaee;border-radius:9px;overflow:hidden;width:120px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--ok)}
.doc{display:grid;grid-template-columns:28px 1fr 110px 120px;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px dashed var(--line)}
.doc:last-child{border-bottom:0}
.doc .nm{font-size:14px}
.doc .meta{font-size:12px;color:var(--muted)}
.doc select{padding:5px 6px;font-size:13.5px;border-radius:6px;border:1px solid #cfd4dc;font-family:inherit}
@media(max-width:640px){.doc{grid-template-columns:24px 1fr;}.doc .pv{grid-column:2}.doc .sl{grid-column:2}}
.s0{background:#fff}.s1{background:var(--pri-weak)}.s2{background:var(--warn-weak)}.s3{background:var(--ok-weak)}.s4{background:var(--bad-weak)}
.chip.ct{background:#eef6f1;color:#25613f}
.chip.st-qc{background:#e6eefc;color:#2b4a8a}.chip.st-rec{background:#efe7fb;color:#5b3a99}
.stat.clickable{cursor:pointer}.stat.on{border-color:#14213d;box-shadow:inset 0 0 0 1px #14213d}
.steps{display:flex;gap:0;margin:4px 0 6px;overflow-x:auto}
.step{flex:1;min-width:76px;text-align:center;position:relative;font-size:12.5px;color:var(--muted)}
.step::before{content:'';position:absolute;top:13px;left:-50%;width:100%;height:2px;background:#dfe3e8;z-index:0}
.step:first-child::before{display:none}
.step i{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid #cfd4dc;font-style:normal;font-weight:700;font-size:12px;color:var(--muted)}
.step span{display:block;margin-top:3px}
.step.done i{background:var(--ok);border-color:var(--ok);color:#fff}.step.done::before,.step.cur::before,.step.rej::before{background:var(--ok)}
.step.cur i{background:var(--pri);border-color:var(--pri);color:#fff}.step.cur span{color:var(--pri);font-weight:700}
.step.rej i{background:var(--bad);border-color:var(--bad);color:#fff}.step.rej span{color:var(--bad);font-weight:700}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:120px}
.stat b{font-size:20px;display:block}
.stat span{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:1px solid #cfd4dc;background:#fff;color:var(--ink);padding:8px 14px;min-height:38px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:14px;line-height:1.3;white-space:nowrap}
.tabs button:hover{background:#f3f5f8}
.tabs button.on,.tabs button.on:hover{background:#14213d;color:#fff;border-color:#14213d;font-weight:600}
.clickable{cursor:pointer}
tr.clickable:hover td{background:#fafbfc}
tr.sub td{background:#fbfcfd}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ph{position:relative}
.ph img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.ph .x{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:13px;line-height:22px;padding:0}
/* 視窗 */
.ov{position:fixed;inset:0;background:rgba(15,20,30,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:30px 12px}
.dlg{background:#fff;border-radius:12px;max-width:640px;width:100%;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.dlg h2{margin-bottom:6px}
.dlg.wide{max-width:960px}
#lb{position:fixed;inset:0;background:rgba(10,12,18,.97);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 12px 20px}
#lb img{max-width:94vw;max-height:calc(100vh - 130px);border-radius:6px;object-fit:contain;background:#222}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);color:#fff;border:0;font-size:32px;width:48px;height:64px;cursor:pointer;border-radius:8px}
#lb .close{position:absolute;top:10px;right:12px;background:rgba(255,255,255,.18);border:0;color:#fff;font-size:15px;cursor:pointer;border-radius:999px;padding:9px 16px;font-family:inherit}
#lb .cap{color:#e5e7eb;font-size:14px;margin-top:10px;text-align:center}
.thumbw{position:relative;display:inline-block}
.thumbw .cnt{position:absolute;right:-4px;bottom:-4px;background:#14213d;color:#fff;font-size:10.5px;border-radius:9px;padding:0 5px;line-height:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:#1d2330;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:90vw}
#toast div.err{background:var(--bad)}
#busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:80;background:linear-gradient(90deg,transparent,var(--pri),transparent);background-size:50% 100%;animation:ld 1s linear infinite}
@keyframes ld{from{background-position:-50% 0}to{background-position:150% 0}}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.lockcard{max-width:420px;margin:40px auto;text-align:center}
.locs{display:flex;flex-direction:column;gap:3px;min-width:150px}
.loc{display:flex;gap:6px;align-items:baseline;white-space:nowrap}.loc span:first-child{color:var(--muted,#667085);min-width:84px}
.loc b{font-size:14px}.loc.neg b{color:var(--bad)}.loc.zero{opacity:.55}
.combo{position:relative;flex:2;min-width:0}.combo .inp{width:100%}
.combo-list{position:absolute;z-index:60;top:calc(100% + 2px);left:0;right:0;max-height:320px;overflow:auto;background:#fff;color:#1d2433;border:1px solid #cfd6e4;border-radius:10px;box-shadow:0 8px 24px rgba(20,33,61,.18)}
.combo-list .it{padding:8px 10px;cursor:pointer;border-bottom:1px solid #f0f2f6;font-size:14px}.combo-list .it.on,.combo-list .it:hover{background:#eaf1fd}.combo-list .it.cur b{color:#1f5fbf}
.combo-list .grp{padding:5px 10px;font-size:12px;font-weight:700;color:#5b6b85;background:#f1f4f9;position:sticky;top:0;z-index:1}
.combo-list .it.add{color:#1f5fbf;font-weight:600;position:sticky;bottom:0;background:#f6f9ff}
.po-th{width:42px;height:42px;object-fit:cover;border-radius:6px;border:1px solid #dde3ee;cursor:pointer;flex:none}
.newmat{margin:8px 0 0 30px;padding:10px;border:1px dashed #9db7e5;border-radius:10px;background:#f7faff}
.pv-page{border:1px solid #cfd6e4;border-radius:8px;padding:14px 16px;margin:10px 0;background:#fff;color:#1d2433}
.pv-page table{width:100%;border-collapse:collapse;font-size:13px}.pv-page th,.pv-page td{border:1px solid #9aa4b5;padding:5px 6px;vertical-align:middle}
.pv-page th{background:#f1f4f9}.pv-hd{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-size:13px;margin:8px 0}
</style>
</head>
<body>
<header><h1 id="ttl">新竹海淡物料管理系統</h1><div class="user" id="userbox"></div></header>
<nav id="nav"></nav>
<main id="app"><div class="empty">載入中…</div></main>
<div id="modal"></div>
<div id="lbwrap"></div>
<div id="toast"></div>
<div id="busy" class="hide"></div>

<script>
/* ============================================================
 * 設定：把 Apps Script「網頁應用程式」部署後的網址貼在下面
 * （網址長得像 https://script.google.com/macros/s/…/exec）
 * ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbypgaHGgWn9n4UbU7QlljHXy0W9tQ9yi8WW4wYK1Iql7zpogr8nCMyTcGKZGrugGOLfEA/exec';

/* ====================== 基本工具 ====================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isNaN(n) ? 0 : n; };
const fmtN = n => { n = Math.round(num(n) * 1000) / 1000; return n.toLocaleString('zh-TW', {maximumFractionDigits: 3}); };
const uniq = a => a.filter((x, i) => x && a.indexOf(x) === i);
const list = s => uniq(String(s || '').split(/[、,，;；\n]/).map(x => x.trim()).filter(Boolean));
const sumObj = o => Object.keys(o).reduce((a, k) => a + num(o[k]), 0);
const pj = s => { try { return s ? JSON.parse(s) : null; } catch (e) { return null; } };
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const store = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
};
const photoUrl = (id, w) => 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + (w || 300);
const label = m => m ? m.名稱 + (m.規格 ? '（' + m.規格 + '）' : '') : '（已刪除的物料）';
const vText = o => o ? Object.keys(o).map(k => k + ' ' + fmtN(o[k])).join('、') : '';

let TOKEN = store.get('wm_token') || '';
let D = null, IX = null, PAGE = 'stock';
const UI = { openM: new Set(), openB: new Set(), openR: new Set(), cat: '全部', rcat: '全部', onlyMissing: false, rvFilter: '全部', setTab: 'perm', logType: '全部' };

function toast(msg, type) {
  const d = document.createElement('div'); d.textContent = msg; if (type) d.className = type;
  $('#toast').appendChild(d); setTimeout(() => d.remove(), type === 'err' ? 5000 : 3200);
}
let busyN = 0;
function busy(on) { busyN += on ? 1 : -1; if (busyN < 0) busyN = 0; $('#busy').classList.toggle('hide', busyN === 0); }

/** 呼叫後端 API（Content-Type 用 text/plain，瀏覽器不會先送 CORS 預檢請求） */
async function transport(action, payload) {
  if (window.__LOCAL_API) return window.__LOCAL_API(action, payload, TOKEN);   // 預覽／測試用
  const res = await fetch(API_URL, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: action, payload: payload, token: TOKEN })
  });
  if (!res.ok) throw new Error('伺服器回應錯誤（' + res.status + '）');
  return res.text();
}
async function call(action, payload) {
  busy(true);
  let text;
  try { text = await transport(action, payload || {}); }
  catch (e) { busy(false); throw new Error(/fetch|network|load/i.test(e.message || '') ? '無法連線到伺服器，請檢查網路，或確認 API_URL 是否正確' : e.message); }
  busy(false);
  let r;
  try { r = JSON.parse(text); }
  catch (e) { throw new Error('伺服器回應格式錯誤：請確認 API_URL，且部署的存取權為「所有人」'); }
  if (r.ok) return r.data;
  if (r.error === 'NEED_LOGIN') { TOKEN = ''; store.set('wm_token', null); openLogin(); }
  throw new Error(r.error);
}
async function run(action, payload) {
  try {
    const d = await call(action, payload);
    if (d && d.__boot) setData(d.__boot);
    return d;
  } catch (e) {
    if (e.message !== 'NEED_LOGIN') toast(e.message || String(e), 'err');
    throw e;
  }
}

/* ====================== 對話框 ====================== */
function openModal(html, wide) { $('#modal').innerHTML = '<div class="ov" onclick="if(event.target===this)closeModal()"><div class="dlg' + (wide ? ' wide' : '') + '">' + html + '</div></div>'; }
function closeModal() { $('#modal').innerHTML = ''; }
function ask(title, opt) {
  opt = opt || {};
  return new Promise(res => {
    window.__askRes = v => { closeModal(); res(v); };
    openModal('<h2>' + esc(title) + '</h2>' + (opt.msg ? '<p class="muted">' + esc(opt.msg) + '</p>' : '') +
      (opt.input ? (opt.multi ? '<textarea class="inp" id="askv">' + esc(opt.value || '') + '</textarea>' : '<input class="inp" id="askv" value="' + esc(opt.value || '') + '" placeholder="' + esc(opt.ph || '') + '">') : '') +
      '<div class="row end" style="margin-top:16px"><button class="btn" onclick="__askRes(null)">取消</button>' +
      '<button class="btn ' + (opt.danger ? 'bad' : 'pri') + '" onclick="__askRes(' + (opt.input ? "document.getElementById(\'askv\').value" : 'true') + ')">' + esc(opt.ok || '確定') + '</button></div>');
    const i = $('#askv'); if (i) { i.focus(); i.onkeydown = e => { if (e.key === 'Enter' && !opt.multi) __askRes(i.value); }; }
  });
}
/** 照片放大檢視：點背景、✕ 關閉或按 Esc 關閉；多張時可左右切換（按鈕、方向鍵、手機左右滑） */
function lightbox(ids, i, cap) {
  window.__lb = { ids: ids, i: i || 0, cap: cap || '' };
  const draw = () => {
    const L = window.__lb;
    $('#lbwrap').innerHTML = '<div id="lb" onclick="if(event.target===this)lbClose()"><button class="close" onclick="lbClose()">✕ 關閉</button>' +
      (L.ids.length > 1 ? '<button class="nav" style="left:10px" onclick="lbGo(-1)">‹</button><button class="nav" style="right:10px" onclick="lbGo(1)">›</button>' : '') +
      '<img src="' + photoUrl(L.ids[L.i], 1600) + '" alt="">' +

PAGES.record = function () {

  const cats = catsOrdered().filter(c => base.some(m => grp(m) === c));
  if (!UI.rcC || cats.indexOf(UI.rcC) < 0) UI.rcC = cats[0] || '';
  const c = UI.rcC;
  // 有搜尋字時跨全部大類搜尋；否則只顯示選中的大類
  const ms = base.filter(m => q ? matches(m, q) : grp(m) === c);
  let rows = '', cur = null, curT = null;
  ms.forEach(m => {
    const cat = grp(m);
    if (q && cat !== cur) { cur = cat; curT = null; rows += '<tr class="gh"><td colspan="6">' + esc(catLabel(cat)) + '</td></tr>'; }
    if (typeOf(m) !== curT) { curT = typeOf(m); if (curT === '配料' && cat !== SHARED) rows += '<tr class="gs"><td colspan="6">配料（' + esc(cat) + ' 專用）</td></tr>'; }
    const st = stockOf(m.物料ID), bs = IX.bBy[m.物料ID] || [], open = UI.openR.has(m.物料ID);

function resizeImg(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.82)); }; img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

/* ---------- 自檢追蹤／送審進度 ---------- */
const MISSING = d => d.狀態 === '未收集' || d.狀態 === '需補正' || d.狀態 === '退件';
const DOC_CLS = { '未收集': 's0', '已收集': 's1', '需補正': 's4' };

}

/* 送審流程（每一批進場一套）：尚未檢驗 → 品管查驗 → 資料送審 → 監造查驗 → 紀錄送查 → 已完成；任一階段可退件 */
const FLOW = ['尚未檢驗', '品管查驗', '資料送審', '監造查驗', '紀錄送查', '已完成'];

PAGES.inspect = () => foldPage('inspect');
PAGES.review = () => foldPage('review');

function foldPage(mode) {
  const rv = mode === 'review';
  const q = UI.inQ || '';
  let mats = trackedMats().filter(m => matches(m, q));
  const passBatch = b => {
    if (!rv) return !UI.onlyMissing || (IX.dBy[b.批次ID] || []).some(MISSING);
    return UI.rvFilter === '全部' || stageOf(b) === UI.rvFilter;
  };
  if (rv || UI.onlyMissing) mats = mats.filter(m => batchesTracked(m.物料ID).some(passBatch));
  const catKey = rv ? 'rcat' : 'cat';
  const cats = catsOrdered().filter(c => mats.some(m => grp(m) === c));
  if (UI[catKey] !== '全部' && cats.indexOf(UI[catKey]) < 0) UI[catKey] = '全部';
  const badge = c => { const n = mats.filter(m => c === '全部' || grp(m) === c).reduce((a, m) => a + (rv ? batchesTracked(m.物料ID).filter(b => stageOf(b) === '退件').length : docsOfMat(m.物料ID).filter(MISSING).length), 0);
    return n ? '<span class="n">' + n + '</span>' : ''; };

  // 統計
  const all = trackedMats();
  const allB = [].concat(...all.map(m => batchesTracked(m.物料ID)));
  const allD = [].concat(...allB.map(b => IX.dBy[b.批次ID] || []));
  const miss = allD.filter(MISSING).length;
  const stats = rv
    ? (D.stages || []).map(s => [s, allB.filter(b => stageOf(b) === s).length, s])
    : [['追蹤材料', all.length + '<small class="muted">（已進場 ' + all.filter(m => batchesTracked(m.物料ID).length).length + '）</small>'], ['進場批次', allB.length],
       ['缺件', miss], ['已收集', allD.length - miss]];

  let html = '<div class="card"><div class="row"><h2 style="margin:0">' + (rv ? '送審進度' : '自檢追蹤（缺件清單）') + '</h2><span class="sp"></span>' +
    (rv ? '' : '<button class="btn sm" onclick="openMissExport()">⬇ 匯出缺件 Excel</button>') +
    '<span class="small muted">' + (rv ? FLOW.join(' → ') + '（任一階段可退件）' : '大類 → 材料細項 → 進場日期 → 自檢資料') + '</span></div>' +
    '<div class="stats" style="margin-top:10px">' + stats.map(s => '<div class="stat' + (rv ? ' clickable' : '') + (rv && UI.rvFilter === s[2] ? ' on' : '') + '"' +
      (rv ? ' data-s="' + esc(s[2]) + '" onclick="UI.rvFilter=(UI.rvFilter===this.dataset.s?\'全部\':this.dataset.s);render()"' : '') + '><b>' + s[1] + '</b><span>' + s[0] + (rv ? ' 批' : '') + '</span></div>').join('') + '</div>' +
    (rv ? '<input class="inp" placeholder="🔍 搜尋材料" value="' + esc(q) + '" id="q_inQ" oninput="UI.inQ=this.value;rerenderKeep(this)">' +
          '<div class="tabs" style="margin:10px 0 0">' + ['全部'].concat(D.stages || []).map(x => '<button class="' + (UI.rvFilter === x ? 'on' : '') + '" data-s="' + esc(x) + '" onclick="UI.rvFilter=this.dataset.s;render()">' + esc(x) + '</button>').join('') + '</div>'
        : '<div class="grid2"><input class="inp" placeholder="🔍 搜尋材料" value="' + esc(q) + '" id="q_inQ" oninput="UI.inQ=this.value;rerenderKeep(this)">' +
          '<label class="chk" style="margin:0"><input type="checkbox"' + (UI.onlyMissing ? ' checked' : '') + ' onchange="UI.onlyMissing=this.checked;render()"> 只顯示有缺件的</label></div>') + '</div>';

  html += '<div class="cats">' + ['全部'].concat(cats).map(c => '<button class="' + (UI[catKey] === c ? 'on' : '') + '" data-c="' + esc(c) + '" onclick="UI.' + catKey + '=this.dataset.c;render()">' + esc(c === '全部' ? c : catLabel(c)) + badge(c) + '</button>').join('') + '</div>';

  let cur = null;

    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    a.download = '自檢缺件清單_' + now + '.xlsx';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    window.__lastExport = buf;
    toast('已產生 Excel（共 ' + rows.length + ' 份待收文件）');
  } catch (e) { toast(e.message || String(e), 'err'); }
  if (btn) { btn.disabled = false; btn.textContent = '⬇ 下載 Excel'; }
}
function patchDocs(docs, removeId) {
  if (removeId) D.docs = D.docs.filter(d => d.文件ID !== removeId);
  (docs || []).forEach(n => { const i = D.docs.findIndex(d => d.文件ID === n.文件ID); if (i >= 0) D.docs[i] = n; else D.docs.push(n); });
  index(); render();
}
async function setDoc(id, st) { try { const r = await call('saveDoc', { id: id, 狀態: st }); patchDocs(r.docs); if (r.shared) toast('已同步更新共用的 ' + r.shared + ' 份'); } catch (e) { toast(e.message, 'err'); render(); } }
async function noteDoc(id) {
  const d = D.docs.find(x => x.文件ID === id);
  const v = await ask('備註：' + d.文件項目, { input: true, value: d.備註, ph: '例：已請原廠補寄、退件原因…' });
  if (v === null) return;
  try { const r = await call('saveDoc', { id: id, 備註: v }); patchDocs(r.docs); if (r.shared) toast('備註已同步到共用的 ' + r.shared + ' 份'); } catch (e) { toast(e.message, 'err'); }
}
async function bulk(bid, from, to) {
  try { const r = await call('bulkDocs', { batchId: bid, from: from, to: to }); patchDocs(r.docs); toast('已更新 ' + r.count + ' 項' + (r.shared ? '，並同步共用的 ' + r.shared + ' 份' : '')); } catch (e) { toast(e.message, 'err'); }
}
async function addDoc(bid) {
  const v = await ask('新增文件項目', { input: true, ph: '例：材料型錄、試驗報告' }); if (!v) return;
  try { const r = await call('addDoc', { batchId: bid, name: v }); patchDocs(r.docs); } catch (e) { toast(e.message, 'err'); }
}
async function delDoc(id) {
  const d = D.docs.find(x => x.文件ID === id);
  if (!(await ask('移除「' + d.文件項目 + '」？', { msg: '只移除此批次的這一項。', danger: true, ok: '移除' }))) return;
  try { await call('deleteDoc', { id: id }); patchDocs([], id); } catch (e) { toast(e.message, 'err'); }
}
async function syncDocs(bid) {
  try { const r = await call('syncDocs', { batchId: bid }); const before = (IX.dBy[bid] || []).length; patchDocs(r.docs); toast(r.docs.length > before ? '已補上 ' + (r.docs.length - before) + ' 項' : '文件項目已齊全'); }
  catch (e) { toast(e.message, 'err'); }
}
async function setTrack(bid, on) {
  if (!on && !(await ask('取消追蹤此批次？', { msg: '此批的自檢文件紀錄會被刪除（進場與庫存紀錄保留）。', danger: true, ok: '取消追蹤' }))) return;
  await run('setTracking', { batchId: bid, on: on }); if (on) UI.openB.add(bid); toast(on ? '已加入追蹤' : '已取消追蹤');
}

/* ---------- 系統設定（管理員） ---------- */
PAGES.settings = function () {
  const t = UI.setTab;
  let body = '';
  if (t === 'perm') {
    const roles = (D.roles || ['管理員', '一般']).filter(r => r !== '管理員');
    body = '<p class="muted small">「公開」：任何拿到連結的人不需登入即可觀看與操作。「所有登入帳號」：任何角色登入後都能使用。「指定角色」：只有勾選的角色看得到這一頁（沒權限的頁面不會出現在選單）。管理員可進入所有頁面；系統設定只限管理員。角色可在「帳號管理」新增。</p>' +
      '<div class="tbl"><table><thead><tr><th>頁面</th><th>開放對象</th><th>指定角色</th><th>此頁連結</th></tr></thead><tbody>' +
      D.pages.filter(p => p.id !== 'settings').map(p => {
        const mode = p.perm === '公開' ? 'pub' : String(p.perm).indexOf('角色:') === 0 ? 'role' : 'all';
        const sel = mode === 'role' ? String(p.perm).slice(3).split(',') : [];
        return '<tr><td>' + esc(p.name) + '</td><td><select class="inp perm" data-id="' + p.id + '" style="width:auto" onchange="this.closest(\'tr\').querySelector(\'.prole\').classList.toggle(\'hide\',this.value!==\'role\')">' +
          [['pub', '公開'], ['all', '所有登入帳號'], ['role', '指定角色']].map(x => '<option value="' + x[0] + '"' + (x[0] === mode ? ' selected' : '') + '>' + x[1] + '</option>').join('') + '</select></td>' +
          '<td><div class="prole row' + (mode === 'role' ? '' : ' hide') + '" style="gap:10px">' + roles.map(r => '<label class="chk" style="margin:0;font-size:13.5px"><input type="checkbox" value="' + esc(r) + '"' + (sel.indexOf(r) >= 0 ? ' checked' : '') + '> ' + esc(r) + '</label>').join('') + '</div></td>' +
          '<td><input class="inp small" readonly value="' + esc(pageUrl(p.id)) + '" onclick="this.select();copyText(this.value)"></td></tr>';
      }).join('') +
      '</tbody></table></div><div class="row end" style="margin-top:12px"><button class="btn pri" onclick="savePerms()">儲存權限</button></div>';
  } else if (t === 'user') {
    body = '<div class="row end"><button class="btn pri" onclick="userForm()">＋ 新增帳號</button></div><div class="tbl"><table><thead><tr><th>帳號</th><th>顯示名稱</th><th>角色</th><th>狀態</th><th></th></tr></thead><tbody>' +
      (D.users || []).map(u => '<tr><td>' + esc(u.帳號) + '</td><td>' + esc(u.顯示名稱) + '</td><td>' + esc(u.角色) + '</td><td>' + (u.啟用 === '否' ? '<span class="chip bad">停用</span>' : '<span class="chip ok">啟用</span>') +
        '</td><td><button class="btn sm" data-a="' + esc(u.帳號) + '" onclick="userForm(this.dataset.a)">編輯</button></td></tr>').join('') + '</tbody></table></div>' +
      '<p class="muted small">管理員：可進入所有頁面、系統設定、刪除異動紀錄。其他角色看得到哪些頁面，在「頁面權限」設定。</p>' +
      '<h3>角色</h3><p class="muted small">每行一個，例如：辦公室、工地、監造。「管理員」「一般」為固定角色，不用列在這裡。</p>' +
      '<textarea class="inp" style="min-height:100px;max-width:360px" id="ls_角色">' + esc((D.roles || []).filter(r => r !== '管理員' && r !== '一般').join('\n')) + '</textarea>' +
      '<div><button class="btn sm" style="margin-top:6px" onclick="saveList(\'角色\')">儲存角色</button></div>';
  } else if (t === 'legacy') {
    body = '<h3 style="margin-top:0">A. 舊「材料進場與自檢管理」網頁的資料</h3>' +
      '<p class="muted small">選擇「舊資料匯入.json」檔案。會匯入：七大類名稱、材料細項（含規格、單位、購買流程、供應商）、每一筆進場與施工紀錄、自檢文件與送審狀態。名稱＋規格已存在的物料不會重複建立。只能匯入一次。</p>' +
      '<input type="file" accept=".json,application/json" id="lgFile" onchange="legacyPick(this)"><div id="lgPrev" class="info small" style="display:none"></div>' +
      '<button class="btn pri" id="lgBtn" style="margin-top:10px;display:none" onclick="legacyImport()">開始匯入</button>' +
      '<h3>B. 舊「物料管理」試算表的物料與庫存</h3>' +
      '<p class="muted small">打開舊的物料管理試算表，選取物料清單（含第一列標題）複製，到「材料管理 → 批次匯入」貼上。可辨識：名稱、規格、單位、庫存（成為期初庫存）、存放位置、照片（雲端硬碟連結或檔案 ID）等欄位。已存在的物料只補空白欄位、不重複加庫存。</p>' +
      (can('material') ? '<button class="btn" onclick="go(\'material\');setTimeout(openImport,50)">前往批次匯入</button>' : '');
  } else {
    body = '<p class="muted small">每行一項，順序即為下拉選單與分類的順序。大類請依「材料進場與施工紀錄表」填入七大類，第八大類「吊管支架」固定排在最後；無法歸類的材料請設為配料（共用配料不需列在這裡）。可共用的自檢文件：同一供應商、同一天進場的批次，文件名稱含這些字的只需交一份，更新狀態時會一起更新。</p><div class="grid3">' +
      [['人員', D.persons, '人員'], ['大項目', D.categories, '大類（七大類＋吊管支架）'], ['共用文件', D.shareKeys, '可共用的自檢文件（關鍵字）']].map(x => '<div><label>' + x[2] + '</label><textarea class="inp" style="min-height:220px" id="ls_' + x[0] + '">' + esc((x[1] || []).join('\n')) + '</textarea>' +
        '<button class="btn sm" style="margin-top:6px" onclick="saveList(\'' + x[0] + '\')">儲存' + x[0] + '</button></div>').join('') + '</div>';
  }
  return '<div class="card"><h2>系統設定</h2><div class="tabs">' + [['perm', '頁面權限'], ['user', '帳號管理'], ['list', '下拉清單'], ['legacy', '匯入舊資料']].map(x =>
    '<button class="' + (t === x[0] ? 'on' : '') + '" onclick="UI.setTab=\'' + x[0] + '\';render()">' + x[1] + '</button>').join('') + '</div>' + body + '</div>';
};
function pageUrl(id) { return location.href.split('#')[0] + '#' + id; }
let LEGACY = null;
function legacyPick(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.materials)) throw new Error('x');
      LEGACY = d;
      $('#lgPrev').style.display = 'block';
      $('#lgPrev').innerHTML = '大類 ' + (d.categories || []).length + ' 個（' + esc((d.categories || []).join('、')) + '）<br>材料細項 ' + d.materials.length + ' 項、進場 ' + (d.receipts || []).length + ' 批、施工 ' + (d.issues || []).length + ' 筆';
      $('#lgBtn').style.display = 'inline-block';
    } catch (e) { LEGACY = null; toast('檔案格式不正確', 'err'); }
  };
  r.readAsText(f);
}
async function legacyImport() {
  if (!LEGACY) return;
  if (!(await ask('開始匯入舊資料？', { msg: '匯入後會出現在庫存、紀錄表、自檢追蹤與送審進度。只能匯入一次。', ok: '匯入' }))) return;
  try {
    const d = await run('importLegacy', LEGACY);
    const x = d.result;
    LEGACY = null;
    ask('匯入完成', { msg: Object.keys(x).map(k => k + '：' + x[k]).join('　') });
  } catch (e) {}
}
function copyText(v) { try { navigator.clipboard.writeText(v).then(() => toast('已複製連結')); } catch (e) {} }
async function savePerms() {
  const perms = {}; let bad = '';
  $$('.perm').forEach(s => {
    if (s.value === 'pub') perms[s.dataset.id] = '公開';
    else if (s.value === 'all') perms[s.dataset.id] = '需登入';
    else {
      const rs = Array.from(s.closest('tr').querySelectorAll('.prole input:checked')).map(i => i.value);
      if (!rs.length) bad = D.pages.find(p => p.id === s.dataset.id).name;
      perms[s.dataset.id] = '角色:' + rs.join(',');
    }
  });
  if (bad) return toast('「' + bad + '」選了指定角色，但沒有勾選任何角色', 'err');
  await run('savePerms', { perms: perms }); toast('權限已儲存');
}
async function saveList(sheet) {
  await run('saveList', { sheet: sheet, items: $('#ls_' + sheet).value.split('\n') }); toast(sheet + '清單已儲存');
}
function userForm(acc) {
  const u = acc ? (D.users || []).find(x => x.帳號 === acc) : null;
  openModal('<h2>' + (u ? '編輯帳號' : '新增帳號') + '</h2><label>帳號（英數字）</label><input class="inp" id="ufA" value="' + esc(u ? u.帳號 : '') + '"' + (u ? ' disabled' : '') + '>' +
    '<label>顯示名稱</label><input class="inp" id="ufN" value="' + esc(u ? u.顯示名稱 : '') + '">' +
    '<label>' + (u ? '重設密碼（留空＝不變）' : '密碼（至少 4 碼）') + '</label><input class="inp" id="ufP" type="password">' +
    '<div class="grid2"><div><label>角色</label><select class="inp" id="ufR">' + (D.roles || ['一般', '管理員']).map(x => '<option' + (u && u.角色 === x ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></div>' +
    '<div><label>狀態</label><select class="inp" id="ufE">' + [['是', '啟用'], ['否', '停用']].map(x => '<option value="' + x[0] + '"' + (u && u.啟用 === x[0] ? ' selected' : '') + '>' + x[1] + '</option>').join('') + '</select></div></div>' +
    '<div class="row" style="margin-top:16px">' + (u && (!D.me || u.帳號 !== D.me.帳號) ? '<button class="btn bad" onclick="delUser(\'' + esc(u.帳號) + '\')">刪除帳號</button>' : '') +
    '<span class="sp"></span><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" onclick="saveUserF(' + (u ? 'false' : 'true') + ')">儲存</button></div>');
}
async function saveUserF(isNew) {
  try {
    await run('saveUser', { isNew: isNew, 帳號: $('#ufA').value.trim(), 顯示名稱: $('#ufN').value.trim(), 密碼: $('#ufP').value, 角色: $('#ufR').value, 啟用: $('#ufE').value });
    closeModal(); toast('帳號已儲存');
  } catch (e) {}
}
async function delUser(acc) {
  if (!(await ask('刪除帳號「' + acc + '」？', { danger: true, ok: '刪除' }))) return;
  await run('deleteUser', { 帳號: acc }); toast('已刪除');
}

/* ====================== 開始 ====================== */
window.addEventListener('hashchange', () => {
  const p = location.hash.slice(1);
  if (p && p !== PAGE && D) { PAGE = p; render(); window.scrollTo(0, 0); }
});
PAGE = location.hash.slice(1) || 'stock';
if (!window.__LOCAL_API && /請貼上部署網址/.test(API_URL)) {
  $('#app').innerHTML = '<div class="card"><h2>尚未設定 API 網址</h2><p>請用文字編輯器打開 index.html，把最上方 <code>API_URL</code> 換成 Apps Script 部署後的網址，再重新上傳。</p></div>';
} else boot();
</script>
